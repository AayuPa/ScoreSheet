<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoresheet - Live Soccer Scores</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>Scoresheet</h1>
            <nav>
                <a href="#">Live Matches</a>
                <a href="#">Leagues</a>
                <a href="#">Stats</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h2>Live Matches</h2>
            <div class="match-list">
                <div class="match-card">
                    <div class="match-info">
                        <span class="league">Premier League</span>
                        <span class="status live">LIVE</span>
                        <span class="minute">75'</span>
                    </div>
                    <div class="teams">
                        <div class="team">
                            <span class="team-name">Team A</span>
                            <span class="score">2</span>
                        </div>
                        <div class="vs">-</div>
                        <div class="team">
                            <span class="score">1</span>
                            <span class="team-name">Team B</span>
                        </div>
                    </div>
                    <div class="stats-link">
                        <a href="#">View Stats &raquo;</a>
                    </div>
                </div>
                <div class="match-card">
                     <div class="match-info">
                        <span class="league">La Liga</span>
                        <span class="status finished">FT</span>
                         <span class="minute">90'</span>
                    </div>
                    <div class="teams">
                         <div class="team">
                            <span class="team-name">Team C</span>
                            <span class="score">0</span>
                        </div>
                        <div class="vs">-</div>
                        <div class="team">
                            <span class="score">0</span>
                            <span class="team-name">Team D</span>
                        </div>
                    </div>
                     <div class="stats-link">
                        <a href="#">View Stats &raquo;</a>
                    </div>
                </div>
            </div>

            <h2>Statistics Highlight (Example)</h2>
            <div class="stats-overview">
                <p>Graphs and detailed statistics will appear here.</p>
                 </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Scoresheet. All rights reserved.</p>
        </div>
    </footer>

    </body>
</html>
